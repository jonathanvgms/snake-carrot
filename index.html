<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake - Persigue las Zanahorias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            gap: 30px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 640px;
            padding: 10px 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.5);
            color: #ffa500;
        }

        .score-board {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .score-board span {
            background: rgba(255, 165, 0, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #ffa500;
        }

        #gameCanvas {
            border: 4px solid #ffa500;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 165, 0, 0.3);
            background: #0f0f23;
        }

        .controls {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #ff4444;
            display: none;
        }

        .game-over h2 {
            color: #ff4444;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .game-over button {
            background: #ffa500;
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .game-over button:hover {
            transform: scale(1.1);
        }

        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #ffa500;
        }

        .start-screen h2 {
            color: #ffa500;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .start-screen button {
            background: #ffa500;
            color: #1a1a2e;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .start-screen button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="game-area">
        <h1>🐍 Snake</h1>
        <div class="score-board">
            <span>Puntos: <strong id="score">0</strong></span>
            <span>Nivel: <strong id="level">1</strong></span>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="controls">Usa las flechas del teclado para moverte</div>
    </div>
    <div class="side-panel">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
            <input type="file" id="imageInput" accept="image/png,image/jpeg,image/jpg" hidden>
            <button onclick="document.getElementById('imageInput').click()" style="width:170px;background:#ffa500;color:#1a1a2e;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:1rem;">🎨 Cargar fondo</button>
            <button onclick="resetBackground()" id="resetBgBtn" style="width:170px;background:#555;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:1rem;">Restaurar fondo</button>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
            <button onpointerdown="setDirection(0, -1)" style="width:80px;height:80px;font-size:38px;background:#333;color:#fff;border:3px solid #ffa500;border-radius:14px;cursor:pointer;user-select:none;touch-action:manipulation;box-shadow:0 4px 12px rgba(255,165,0,0.3);">⬆</button>
            <div style="display:flex;gap:8px;">
                <button onpointerdown="setDirection(-1, 0)" style="width:80px;height:80px;font-size:38px;background:#333;color:#fff;border:3px solid #ffa500;border-radius:14px;cursor:pointer;user-select:none;touch-action:manipulation;box-shadow:0 4px 12px rgba(255,165,0,0.3);">⬅</button>
                <button onpointerdown="setDirection(1, 0)" style="width:80px;height:80px;font-size:38px;background:#333;color:#fff;border:3px solid #ffa500;border-radius:14px;cursor:pointer;user-select:none;touch-action:manipulation;box-shadow:0 4px 12px rgba(255,165,0,0.3);">➡</button>
            </div>
            <button onpointerdown="setDirection(0, 1)" style="width:80px;height:80px;font-size:38px;background:#333;color:#fff;border:3px solid #ffa500;border-radius:14px;cursor:pointer;user-select:none;touch-action:manipulation;box-shadow:0 4px 12px rgba(255,165,0,0.3);">⬇</button>
        </div>
    </div>
    
    <div class="start-screen" id="startScreen">
        <h2>🥕 Persigue las Zanahorias</h2>
        <p style="margin-bottom: 20px;">10 puntos por zanahoria</p>
        <button onclick="startGame()">¡JUGAR!</button>
    </div>

    <div class="game-over" id="gameOver">
        <h2>¡GAME OVER!</h2>
        <p id="finalScore" style="font-size: 1.5rem; margin-bottom: 20px;">Puntos: 0</p>
        <button onclick="resetGame()">REINTENTAR</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const gameOverEl = document.getElementById('gameOver');
        const startScreenEl = document.getElementById('startScreen');
        const finalScoreEl = document.getElementById('finalScore');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let foods = [];
        const FOOD_EMOJIS = ['🥕', '🍑', '🍊', '🚧', '🥟', '🐉', '🐯'];
        const FOOD_COUNT = 8;
        let score = 0;
        let level = 1;
        let gameSpeed = 150;
        let gameLoop = null;
        let isPlaying = false;

        let audioCtx = null;
        let bgMusicInterval = null;
        let bgGain = null;

        let bgPattern = null;
        let useDefaultBg = true;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, duration, type, volume) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playMelody(notes) {
            if (!audioCtx) return;
            notes.forEach((n, i) => {
                setTimeout(() => playTone(n[0], n[1], n[2], n[3]), n[4] || 0);
            });
        }

        function playEatSound() {
            playTone(523, 0.1, 'square', 0.1);
            setTimeout(() => playTone(659, 0.1, 'square', 0.1), 80);
        }

        function playLevelUpSound() {
            playMelody([
                [523, 0.15, 'square', 0.1, 0],
                [659, 0.15, 'square', 0.1, 100],
                [784, 0.15, 'square', 0.1, 200],
                [1047, 0.3, 'square', 0.12, 300],
            ]);
        }

        function playGameOverSound() {
            playMelody([
                [400, 0.2, 'sawtooth', 0.12, 0],
                [300, 0.2, 'sawtooth', 0.12, 150],
                [200, 0.4, 'sawtooth', 0.12, 300],
            ]);
        }

        function startBgMusic() {
            if (!audioCtx) return;
            const notes = [262, 294, 330, 349, 392, 349, 330, 294];
            let step = 0;
            bgGain = audioCtx.createGain();
            bgGain.gain.value = 0.04;
            bgGain.connect(audioCtx.destination);
            bgMusicInterval = setInterval(() => {
                const osc = audioCtx.createOscillator();
                osc.type = 'triangle';
                osc.frequency.value = notes[step % notes.length];
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0.05, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(g);
                g.connect(bgGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
                step++;
            }, 300);
        }

        function stopBgMusic() {
            clearInterval(bgMusicInterval);
            bgMusicInterval = null;
        }

        function loadImageAsPixelArt(file) {
            const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
            if (!validTypes.includes(file.type)) {
                alert('Solo se aceptan PNG, JPEG o JPG');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const offscreen = document.createElement('canvas');
                    offscreen.width = TILE_COUNT;
                    offscreen.height = TILE_COUNT;
                    const offCtx = offscreen.getContext('2d');
                    offCtx.drawImage(img, 0, 0, TILE_COUNT, TILE_COUNT);
                    const imageData = offCtx.getImageData(0, 0, TILE_COUNT, TILE_COUNT);
                    const bigCanvas = document.createElement('canvas');
                    bigCanvas.width = canvas.width;
                    bigCanvas.height = canvas.height;
                    const bigCtx = bigCanvas.getContext('2d');
                    const scaled = bigCtx.createImageData(canvas.width, canvas.height);
                    for (let y = 0; y < TILE_COUNT; y++) {
                        for (let x = 0; x < TILE_COUNT; x++) {
                            const idx = (y * TILE_COUNT + x) * 4;
                            const r = imageData.data[idx];
                            const g = imageData.data[idx + 1];
                            const b = imageData.data[idx + 2];
                            const a = imageData.data[idx + 3];
                            for (let py = 0; py < GRID_SIZE; py++) {
                                for (let px = 0; px < GRID_SIZE; px++) {
                                    const dstIdx = ((y * GRID_SIZE + py) * canvas.width + (x * GRID_SIZE + px)) * 4;
                                    scaled.data[dstIdx] = r;
                                    scaled.data[dstIdx + 1] = g;
                                    scaled.data[dstIdx + 2] = b;
                                    scaled.data[dstIdx + 3] = a;
                                }
                            }
                        }
                    }
                    bigCtx.putImageData(scaled, 0, 0);
                    bgPattern = bigCtx.createPattern(bigCanvas, 'no-repeat');
                    useDefaultBg = false;
                    draw();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetBackground() {
            useDefaultBg = true;
            bgPattern = null;
            draw();
        }

        function initSnake() {
            snake = [
                { x: 10, y: 15 },
                { x: 9, y: 15 },
                { x: 8, y: 15 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
        }

        function spawnCarrot() {
            for (let i = foods.length; i < FOOD_COUNT; i++) {
                let f = { x: 0, y: 0, emoji: FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)] };
                let valid = false;
                while (!valid) {
                    f.x = Math.floor(Math.random() * TILE_COUNT);
                    f.y = Math.floor(Math.random() * TILE_COUNT);
                    valid = !snake.some(s => s.x === f.x && s.y === f.y)
                        && !foods.some(g => g.x === f.x && g.y === f.y);
                }
                foods.push(f);
            }
        }

        function drawGrid() {
            for (let i = 0; i < TILE_COUNT; i++) {
                ctx.strokeStyle = 'rgba(255, 165, 0, 0.1)';
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }
        }

        function drawSnake() {
            for (let i = snake.length - 1; i >= 0; i--) {
                const x = snake[i].x * GRID_SIZE;
                const y = snake[i].y * GRID_SIZE;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                if (i === 0) {
                    ctx.fillStyle = '#ff6b35';
                    ctx.beginPath();
                    ctx.arc(x + GRID_SIZE/2, y + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#ffa500';
                    ctx.beginPath();
                    ctx.roundRect(x + 2, y + 2, GRID_SIZE - 4, GRID_SIZE - 4, 5);
                    ctx.fill();
                    ctx.stroke();
                }
            }
        }

        function drawCarrot() {
            ctx.font = `bold ${GRID_SIZE - 2}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (const f of foods) {
                const cx = f.x * GRID_SIZE + GRID_SIZE / 2;
                const cy = f.y * GRID_SIZE + GRID_SIZE / 2;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(f.emoji, cx, cy);
                ctx.fillText(f.emoji, cx, cy);
            }
        }

        function draw() {
            if (useDefaultBg || !bgPattern) {
                ctx.fillStyle = '#0f0f23';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = bgPattern;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            drawGrid();
            drawCarrot();
            drawSnake();
        }

        function update() {
            direction = { ...nextDirection };

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                endGame();
                return;
            }

            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            let ate = false;
            for (let i = 0; i < foods.length; i++) {
                if (head.x === foods[i].x && head.y === foods[i].y) {
                    ate = true;
                    foods.splice(i, 1);
                    break;
                }
            }

            if (ate) {
                score += 10;
                scoreEl.textContent = score;
                playEatSound();

                if (score >= level * 100) {
                    level++;
                    levelEl.textContent = level;
                    playLevelUpSound();
                    gameSpeed = Math.max(50, 150 - (level - 1) * 15);
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }

                spawnCarrot();
            } else {
                snake.pop();
            }
        }

        function gameStep() {
            update();
            draw();
        }

        function startGame() {
            startScreenEl.style.display = 'none';
            isPlaying = true;
            initAudio();
            initSnake();
            foods = [];
            spawnCarrot();
            score = 0;
            level = 1;
            gameSpeed = 150;
            scoreEl.textContent = score;
            levelEl.textContent = level;
            draw();
            startBgMusic();
            gameLoop = setInterval(gameStep, gameSpeed);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameLoop);
            stopBgMusic();
            playGameOverSound();
            finalScoreEl.textContent = `Puntos: ${score}`;
            gameOverEl.style.display = 'block';
        }

        function resetGame() {
            gameOverEl.style.display = 'none';
            startGame();
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                loadImageAsPixelArt(e.target.files[0]);
            }
        });

        function setDirection(x, y) {
            if (!isPlaying) return;
            if (x !== 0 && direction.x !== -x) {
                nextDirection = { x, y: 0 };
            } else if (y !== 0 && direction.y !== -y) {
                nextDirection = { x: 0, y };
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            
            switch(e.key) {
                case 'ArrowUp':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        draw();
    </script>
</body>
</html>
